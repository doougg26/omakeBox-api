services:
  - type: web
    name: omakebox-api
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase:
          name: omakebox-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: omakebox-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: omakebox-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: omakebox-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: omakebox-db
          property: password
      - key: DB_URL
        fromDatabase:
          name: omakebox-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: FRONTEND_URL
        value: https://omakebox.vercel.app

databases:
  - name: omakebox-db
    plan: free
    region: ohio
    databaseName: omakebox
    ipAllowList: []
